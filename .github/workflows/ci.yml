name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
          POSTGRES_DB: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace -d workspace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://workspace:workspace@localhost:5432/workspace_test?schema=public
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci-secret-with-more-than-32-characters-long
      WEB_ORIGIN: http://localhost:3000
      RUN_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm ci
        working-directory: api
      - run: npx prisma migrate deploy
        working-directory: api
      - run: npm run build
        working-directory: api
      - run: npm test
        working-directory: api
